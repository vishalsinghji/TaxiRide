version: "1.0"

services:
  frontend:
    build: .
    container_name: ride_frontend
    ports:
      - "8081:80" # Map Nginx port 80 to host 8081
    depends_on:
      - backend
    networks:
      - app_network

  backend:
    image: taxiride_backend:latest
    container_name: spring_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/taxiride
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - db
    networks:
      - app_network

  db:
    image: postgres:latest
    container_name: postgres_db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=taxiride
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
