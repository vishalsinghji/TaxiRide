server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taxiride
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: taxiRide-service